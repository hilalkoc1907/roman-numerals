<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roma Rakamı Çevirici</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #3b2a1a;
      --ink-soft: #6b5238;
      --gold: #8a6d1d;
      --wine: #7a1f1f;
      --green: #3d5a2a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 40px 16px;
      display: flex; justify-content: center; align-items: flex-start;
      font-family: "IM Fell English", Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(60,35,10,.55) 100%),
        #b89b6a;
    }
    .scroll {
      width: 100%; max-width: 560px; padding: 14px;
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .08  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
        radial-gradient(ellipse at 30% 20%, #f3e4bd 0%, #e6cf9a 60%, #d2b47a 100%);
      border-radius: 6px;
      box-shadow: 0 0 0 3px var(--ink), 0 0 0 7px #e6cf9a, 0 0 0 9px var(--ink),
                  0 20px 50px rgba(0,0,0,.6), inset 0 0 60px rgba(120,80,20,.45);
    }
    .inner { border: 2px solid var(--ink-soft); padding: 28px 24px; }
    h1 {
      font-family: "Cinzel Decorative", "Times New Roman", serif;
      text-align: center; margin: 0 0 4px; font-size: 1.7rem; color: var(--wine);
      text-shadow: 1px 1px 0 rgba(255,255,255,.35);
    }
    .sub { text-align: center; font-style: italic; color: var(--ink-soft); margin: 0 0 18px; }
    .divider { text-align: center; color: var(--gold); letter-spacing: .5em; margin: 14px 0; }
    h2 {
      font-family: Cinzel, "Times New Roman", serif; font-size: 1rem;
      letter-spacing: .12em; text-transform: uppercase; margin: 0 0 8px;
    }
    input {
      width: 100%; font-family: Cinzel, "Times New Roman", serif; font-size: 1.4rem;
      padding: 10px 12px; color: var(--ink);
      background: rgba(255,248,225,.55);
      border: 2px solid var(--ink-soft); border-radius: 3px;
      box-shadow: inset 0 2px 6px rgba(80,50,10,.3);
    }
    input::placeholder { color: rgba(90,65,35,.45); }
    input:focus { outline: none; border-color: var(--wine); }
    .result { min-height: 52px; margin-top: 10px; font-size: 1.9rem;
              font-family: Cinzel, "Times New Roman", serif; font-weight: 600; }
    .ok { color: var(--green); }
    .err { color: var(--wine); font-size: 1.05rem; font-style: italic;
           font-family: "IM Fell English", serif; font-weight: 400; }
    .hint { font-size: .9rem; font-style: italic; color: var(--ink-soft); text-align: center; }
    ul { margin: 6px 0 0; padding-left: 20px; }
    li { margin: 2px 0; }
    #roman-input { text-transform: uppercase; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .copy {
      font-family: Cinzel, "Times New Roman", serif; font-size: .8rem;
      letter-spacing: .08em; padding: 8px 14px; cursor: pointer;
      color: var(--ink); background: rgba(255,248,225,.6);
      border: 2px solid var(--ink-soft); border-radius: 3px;
      box-shadow: 0 2px 0 var(--ink-soft);
    }
    .copy:hover { border-color: var(--wine); color: var(--wine); }
    .copy:active { transform: translateY(2px); box-shadow: none; }
    .copy[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="scroll">
    <div class="inner">
      <h1>Numeri Romani</h1>
      <p class="sub">Roma rakamı çevirici</p>

      <h2>Roma rakamından sayıya</h2>
      <input id="roman-input" placeholder="MCMXCIV" autocomplete="off" autofocus>
      <div class="row">
        <div id="roman-result" class="result"></div>
        <button id="roman-copy" class="copy" hidden>Kopyala</button>
      </div>

      <div class="divider">❖ ❖ ❖</div>

      <h2>Sayıdan Roma rakamına</h2>
      <input id="number-input" placeholder="1994" inputmode="numeric" autocomplete="off">
      <div class="row">
        <div id="number-result" class="result"></div>
        <button id="number-copy" class="copy" hidden>Kopyala</button>
      </div>

      <p class="hint">1 ile 4999 arası sayılar desteklenir.</p>

      <div class="divider">❖ ❖ ❖</div>
      <h2>Defter</h2>
      <ul id="history"></ul>
    </div>
  </div>

  <script>
    const romanInput = document.getElementById("roman-input");
    const numberInput = document.getElementById("number-input");
    const romanResult = document.getElementById("roman-result");
    const numberResult = document.getElementById("number-result");
    const romanCopy = document.getElementById("roman-copy");
    const numberCopy = document.getElementById("number-copy");
    const history = document.getElementById("history");

    function debounce(fn, ms) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    function show(el, ok, text) {
      el.className = "result " + (ok ? "ok" : "err");
      el.textContent = text;
    }

    function addHistory(line) {
      if (history.firstChild && history.firstChild.textContent === line) return;
      const li = document.createElement("li");
      li.textContent = line;
      history.prepend(li);
      while (history.children.length > 6) history.removeChild(history.lastChild);
    }

    function setupCopy(btn) {
      btn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(btn.dataset.value);
          btn.textContent = "Kopyalandı ✓";
        } catch {
          btn.textContent = "Kopyalanamadı";
        }
        setTimeout(() => { btn.textContent = "Kopyala"; }, 1500);
      });
    }
    setupCopy(romanCopy);
    setupCopy(numberCopy);

    async function ask(url, target, copyBtn, makeLine, getValue) {
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (res.ok) {
          const line = makeLine(data);
          show(target, true, line);
          addHistory(line);
          copyBtn.dataset.value = getValue(data);
          copyBtn.hidden = false;
        } else {
          show(target, false, data.error);
          copyBtn.hidden = true;
        }
      } catch {
        show(target, false, "Sunucuya ulaşılamadı");
        copyBtn.hidden = true;
      }
    }

    romanInput.addEventListener("input", debounce(() => {
      const text = romanInput.value.trim();
      if (!text) { romanResult.textContent = ""; romanCopy.hidden = true; return; }
      ask("/api/convert?roman=" + encodeURIComponent(text), romanResult, romanCopy,
          d => d.roman + " = " + d.value, d => String(d.value));
    }, 350));

    numberInput.addEventListener("input", debounce(() => {
      const text = numberInput.value.trim();
      if (!text) { numberResult.textContent = ""; numberCopy.hidden = true; return; }
      ask("/api/to_roman?number=" + encodeURIComponent(text), numberResult, numberCopy,
          d => d.number + " = " + d.roman, d => d.roman);
    }, 350));
  </script>
</body>
</html>
